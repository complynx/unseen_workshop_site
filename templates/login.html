<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in • UNSEEN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_url('unseen.css') }}">
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="{{ base_path or '/' }}" aria-label="UNSEEN home">
        <img src="{{ static_url('unseen_logo_simple_plain.svg') }}" alt="UNSEEN logo">
      </a>
      <div class="cta">
        <a class="textlink" href="{{ base_path or '/' }}">home</a>
        <a class="btn primary" href="{{ base_path }}/register">register</a>
      </div>
    </div>
  </header>

  <main>
    <section class="pageSection">
      <div class="wrap authWrap">
        <div class="pageTitle">
          <div class="kicker">participants &amp; admins</div>
          <h1>Login</h1>
        </div>
        <p class="fineprint">Admins use the configured credentials. Participants use the email/password set during registration.</p>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% end %}

        <form method="post" action="{{ base_path }}/login">
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="formActions">
            <a class="btn ghost" href="{{ base_path or '/' }}">cancel</a>
            <button class="btn primary" type="submit">log in</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
