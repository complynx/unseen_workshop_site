<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_url('unseen.css') }}">
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="{{ base_path or '/' }}" aria-label="UNSEEN home">
        <img src="{{ static_url('unseen_logo_simple_plain.svg') }}" alt="UNSEEN logo">
      </a>
    </div>
  </header>
  <main>
    <section class="pageSection">
      <div class="wrap authWrap">
        <div class="pageTitle">
          <h1>{{ title }}</h1>
        </div>
        <p class="lead">{{ message }}</p>
        <a class="btn" href="{{ base_path or '/' }}">back home</a>
      </div>
    </section>
  </main>
</body>
</html>
